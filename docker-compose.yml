services:
  ops-brain-api:
    restart: unless-stopped
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port ${OPS_BRAIN_API_PORT:-8000}
    ports:
      - "${OPS_BRAIN_API_PORT:-8000}:${OPS_BRAIN_API_PORT:-8000}"
    environment:
      - POSTGRES_URI=postgresql://postgres:password@postgres:5432/ops_brain
      - REDIS_URL=redis://redis:6379/0
      - LOG_DIR=/logs
      # 中台：镜像内无 .env 时需由 Compose 注入（与仓库 .env.example 一致；可被宿主 .env 覆盖）
      - PLATFORM_CENTER_API_BASE=${PLATFORM_CENTER_API_BASE:-https://platform-center.wlwq.com/api}
      - PLATFORM_CENTER_AUTH_TYPE=${PLATFORM_CENTER_AUTH_TYPE:-token}
      - PLATFORM_CENTER_AUTH_CREDENTIAL=${PLATFORM_CENTER_AUTH_CREDENTIAL:-}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-qwen-max}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - OTEL_SERVICE_NAME=ops-brain
      # 未部署 otel-collector 时不要设置 OTEL_EXPORTER_OTLP_ENDPOINT，否则会一直 UNAVAILABLE
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./logs:/logs

  ops-brain-worker:
    restart: unless-stopped
    build: .
    command: arq src.worker.arq_worker.WorkerSettings
    environment:
      - POSTGRES_URI=postgresql://postgres:password@postgres:5432/ops_brain
      - REDIS_URL=redis://redis:6379/0
      - LOG_DIR=/logs
      - PLATFORM_CENTER_API_BASE=${PLATFORM_CENTER_API_BASE:-https://platform-center.wlwq.com/api}
      - PLATFORM_CENTER_AUTH_TYPE=${PLATFORM_CENTER_AUTH_TYPE:-token}
      - PLATFORM_CENTER_AUTH_CREDENTIAL=${PLATFORM_CENTER_AUTH_CREDENTIAL:-}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-qwen-max}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - OTEL_SERVICE_NAME=ops-brain-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./logs:/logs

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - API_UPSTREAM_HOST=ops-brain-api
      - API_UPSTREAM_PORT=${OPS_BRAIN_API_PORT:-8000}
    depends_on:
      - ops-brain-api

  postgres:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_DB: ops_brain
      POSTGRES_PASSWORD: password
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
  postgres-data:

