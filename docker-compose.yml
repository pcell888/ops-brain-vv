services:
  ops-brain-api:
    restart: unless-stopped
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port ${OPS_BRAIN_API_PORT:-8000}
    ports:
      - "${OPS_BRAIN_API_PORT:-8000}:${OPS_BRAIN_API_PORT:-8000}"
    environment:
      - POSTGRES_URI=postgresql://postgres:password@postgres:5432/ops_brain
      - REDIS_URL=redis://redis:6379/0
      - LOG_DIR=/logs
      # 容器内访问 wlwq 模拟服务须用 Compose 服务名，不能用 localhost
      - WLWQ_BUSINESS_API_BASE=http://wlwq-enterprise:${WLWQ_ENTERPRISE_PORT:-8200}
      # 中台：镜像内无 .env 时需由 Compose 注入（与仓库 .env.example 一致；可被宿主 .env 覆盖）
      - PLATFORM_CENTER_API_BASE=${PLATFORM_CENTER_API_BASE:-https://platform-center.wlwq.com/api}
      - PLATFORM_CENTER_AUTH_TYPE=${PLATFORM_CENTER_AUTH_TYPE:-token}
      - PLATFORM_CENTER_AUTH_CREDENTIAL=${PLATFORM_CENTER_AUTH_CREDENTIAL:-}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=qwen-max
      - LLM_BASE_URL=${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - CREDENTIAL_ENCRYPT_KEY=${CREDENTIAL_ENCRYPT_KEY}
      - OTEL_SERVICE_NAME=ops-brain
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - postgres
      - redis
      - wlwq-enterprise
    volumes:
      - ./logs:/logs

  wlwq-enterprise:
    restart: unless-stopped
    build: .
    command: uvicorn src.wlwq.app:app --host 0.0.0.0 --port ${WLWQ_ENTERPRISE_PORT:-8200}
    ports:
      - "${WLWQ_ENTERPRISE_PORT:-8200}:${WLWQ_ENTERPRISE_PORT:-8200}"
    environment:
      - LOG_DIR=/logs
      # 容器内须用 Compose 服务名 postgres；独立 mock 库 wlwq_mock（对应 wlwq-mock），不与 ops_brain 共用
      - WLWQ_POSTGRES_URI=postgresql+asyncpg://postgres:password@postgres:5432/wlwq_mock
      - WLWQ_MYSQL_HOST=${WLWQ_MYSQL_HOST:-192.168.1.249}
      - WLWQ_MYSQL_PORT=${WLWQ_MYSQL_PORT:-3306}
      - WLWQ_MYSQL_USER=${WLWQ_MYSQL_USER:-wlwq}
      - WLWQ_MYSQL_PASSWORD=${WLWQ_MYSQL_PASSWORD:-Mysql@db$123!}
      - WLWQ_MYSQL_DATABASE=${WLWQ_MYSQL_DATABASE:-wlwq-enterprise-service}
    depends_on:
      - postgres
    volumes:
      - ./logs:/logs

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - BACKEND_URL=http://ops-brain-api:${OPS_BRAIN_API_PORT:-8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - ops-brain-api

  postgres:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_DB: ops_brain
      POSTGRES_PASSWORD: password
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./docker/postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  # ── 可观测性：OTel Collector → Jaeger ──
  otel-collector:
    restart: unless-stopped
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger

  jaeger:
    restart: unless-stopped
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # ── 可观测性：Promtail → Loki ──
  loki:
    restart: unless-stopped
    image: grafana/loki:3.0
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - ./data/loki:/loki

  promtail:
    restart: unless-stopped
    image: grafana/promtail:latest
    volumes:
      - ./logs:/var/log/app:ro
      - ./docker/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki

  # ── Grafana 统一 Dashboard ──
  grafana:
    restart: unless-stopped
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
      - jaeger

volumes:
  frontend_node_modules:
