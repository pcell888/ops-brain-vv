server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ops-brain
    static_configs:
      - targets:
          - localhost
        labels:
          job: ops-brain
          __path__: /var/log/app/*.log

  - job_name: ops-brain-mcp
    static_configs:
      - targets:
          - localhost
        labels:
          job: ops-brain-mcp
          __path__: /var/log/app/mcp-servers.log
